{% extends "base.html" %}

{% block title %}认证成功 - King-WiFi服务{% endblock %}

{% block header_title %}认证成功{% endblock %}
{% block header_subtitle %}您已成功连接到网络{% endblock %}

{% block content %}
<div style="text-align: center;">
    <div class="success-icon">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="2">
            <path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </div>
    
    <div style="margin: 30px 0;">
        <h2 style="color: #4CAF50; margin-bottom: 15px;">连接成功！</h2>
        <p style="font-size: 18px; color: #666; margin-bottom: 20px;">您已成功连接到网络</p>
        <p class="small-text">您现在可以开始浏览互联网，享受高速网络体验</p>
    </div>
    
    {% if browser_url %}
    <a id="openBrowserLink" href="{{ browser_url }}" class="btn" target="_blank" rel="noopener">在浏览器中打开</a>
    {% endif %}
</div>

<script>
    function openInDefaultBrowser(url) {
        var ua = navigator.userAgent || '';
        try {
            if (/Android/i.test(ua)) {
                // Captive portal WebView 里直接 location=http(s) 仍停在系统小窗；
                // intent:// + scheme=http|https 是 Android 跳出到默认浏览器的常用做法。
                var u = new URL(url);
                var authority = u.hostname + (u.port ? (':' + u.port) : '');
                var pathAndQuery = u.pathname + u.search + u.hash;
                var intent = 'intent://' + authority + pathAndQuery +
                    '#Intent;scheme=' + u.protocol.replace(':', '') +
                    ';action=android.intent.action.VIEW' +
                    ';category=android.intent.category.BROWSABLE' +
                    ';S.browser_fallback_url=' + encodeURIComponent(url) +
                    ';end';
                window.location.href = intent;
                return;
            }
            if (/iPhone|iPad|iPod/i.test(ua)) {
                var safariUrl = url
                    .replace(/^https:\/\//i, 'x-safari-https://')
                    .replace(/^http:\/\//i, 'x-safari-http://');
                window.location.href = safariUrl;
                return;
            }
        } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', function () {
        reportAction('auth_ok', {});
        var url = '{{ browser_url|default("", true)|safe }}';
        if (url) {
            openInDefaultBrowser(url);
        }
    });
</script>

{% endblock %}
